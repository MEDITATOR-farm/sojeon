<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 휴대폰 앱처럼 설치해서 쓰기 위한 설정 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="소전">
  <title>해서 → 소전 변환기 | 楷書 to 小篆</title>
  <meta name="description" content="해서체 한자를 입력하면 유니코드 소전(小篆) 글자로 바꿔주는 변환기">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="seal-stamp">篆</div>
      <h1>해서 <span class="arrow">→</span> 소전 변환기</h1>
      <p class="sub">楷書를 입력하면 小篆으로 바꿔 드립니다</p>
      <button id="btn-install" class="btn install" type="button" hidden>📲 휴대폰에 앱으로 설치</button>
      <p id="ios-hint" class="hint" hidden>아이폰: 아래 공유 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있습니다</p>
    </header>

    <section class="card">
      <label for="yin-input" class="label">음·훈으로 찾기</label>
      <input type="text" id="yin-input" class="yin-input" placeholder="예: 천 또는 하늘" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <p id="yin-count" class="hint"></p>
      <div id="yin-list" class="yin-list"></div>
    </section>

    <section class="card">
      <details id="hw-box" class="rs-box">
        <summary class="label">손글씨로 찾기 <span class="rs-sub">손가락으로 그려서</span></summary>
        <div class="hw-wrap"><canvas id="hw-canvas" class="hw-canvas" aria-label="한자를 손으로 쓰는 칸"></canvas></div>
        <div class="buttons hw-buttons">
          <button type="button" id="hw-undo" class="btn">한 획 지우기</button>
          <button type="button" id="hw-clear" class="btn">모두 지우기</button>
        </div>
        <p id="hw-count" class="hint">획 순서대로 또박또박 쓰면 더 잘 찾습니다</p>
        <div id="hw-list" class="rs-grid"></div>
      </details>
    </section>

    <section class="card">
      <details id="rs-box" class="rs-box">
        <summary class="label">부수·획수로 찾기 <span class="rs-sub">음·뜻을 모를 때</span></summary>
        <div class="rs-mode" role="tablist">
          <button type="button" class="btn rs-tab on" data-mode="rad">부수로</button>
          <button type="button" class="btn rs-tab" data-mode="total">총획수로</button>
        </div>
        <div id="rs-picked" class="rs-picked"></div>
        <div id="rs-radicals" class="rs-radicals"></div>
        <div id="rs-strokes" class="rs-strokes"></div>
        <p id="rs-count" class="hint"></p>
        <div id="rs-list" class="rs-list"></div>
      </details>
    </section>

    <section class="card">
      <label for="input" class="label">해서 입력 (楷書)</label>
      <input type="text" id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

      <div class="buttons">
        <button id="btn-convert" class="btn primary">변환하기</button>
        <button id="btn-clear" class="btn">지우기</button>
      </div>
      <p id="font-status" class="hint" style="display:none;"></p>
    </section>

    <section class="card">
      <div class="label">소전 결과 (小篆)</div>
      <div id="output" class="output"></div>
      <p id="stats" class="hint"></p>
    </section>

    <section class="card">
      <div class="label">글자별 대응표</div>
      <div id="pairs" class="pairs"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="shuowen.js"></script>
  <script src="bushou.js"></script>
  <script src="script.js"></script>
</body>
</html>
